# Builds the native (Swift) Cortex app on every push to a native/** branch and,
# when run manually with a tag, publishes it as a PRE-release (never "latest",
# so the current stable release and the auto-updater are untouched).
name: Native

on:
  push:
    branches: ["native/**"]
    paths: ["native/**", "cortexd/**", "src-tauri/src/**", ".github/workflows/native.yml", "src-tauri/icons/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to publish, e.g. v0.3.0-native.1 (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  # Fast feedback: compiles only the Swift code (~1 min) so errors surface quickly.
  swift-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift
        shell: bash
        run: |
          cd native
          set +e
          swift build -c debug > /tmp/swift-build.log 2>&1
          code=$?
          echo "=== swift build exit code: $code ==="
          grep -E "error:" -A5 /tmp/swift-build.log | head -150
          if [ $code -ne 0 ]; then exit $code; fi
          swift test > /tmp/swift-test.log 2>&1
          tcode=$?
          echo "=== swift test exit code: $tcode ==="
          grep -E "error:|failed|Executed|XCTAssert" /tmp/swift-test.log | head -80
          exit $tcode

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cortexd -> target
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Build app + dmg
        run: native/scripts/bundle.sh "${{ inputs.tag || '0.3.0-dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Cortex-native
          path: native/build/Cortex.dmg
      - name: Publish pre-release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp native/build/Cortex.dmg "native/build/Cortex-native-${{ inputs.tag }}.dmg"
          gh release create "${{ inputs.tag }}" "native/build/Cortex-native-${{ inputs.tag }}.dmg" \
            --prerelease --target "$GITHUB_SHA" --title "Cortex native ${{ inputs.tag }}" \
            --notes "Native (Swift) preview. Not notarized: if macOS says the app is damaged run  xattr -cr /Applications/Cortex.app  (or Open Anyway in System Settings → Privacy & Security). Quit the old Cortex first so there aren't two Islands."
