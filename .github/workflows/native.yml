          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Cortex native $TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "Cortex-native-$TAG.dmg" --repo "$GITHUB_REPOSITORY" --clobber
# Builds the native (Swift) Cortex app on every push to a native/** branch and,
# when run manually with a tag, publishes it as a PRE-release (never "latest",
# so the current stable release and the auto-updater are untouched).
name: Native

on:
  push:
    branches: ["native/**"]
    paths: ["native/**", "cortexd/**", ".github/workflows/native.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to publish, e.g. v0.3.0-native.1 (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  # Fast feedback: compiles only the Swift code (~1 min) so errors surface quickly.
  swift-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift
        shell: bash
        run: |
          cd native
          set +e
          swift build -c debug -Xswiftc -warnings-as-errors > /tmp/swift-build.log 2>&1
          code=$?
          echo "=== swift build exit code: $code ==="
          grep -E "error:" -A5 /tmp/swift-build.log | head -150
          echo "=== warnings (unique) ==="
          grep -E "warning:" /tmp/swift-build.log | sed -E 's#/Users/runner/work/aio/aio/native/##' | sort -u | head -80
          if [ $code -ne 0 ]; then exit $code; fi
          swift test > /tmp/swift-test.log 2>&1
          tcode=$?
          echo "=== swift test exit code: $tcode ==="
          grep -E "error:|failed|Executed|XCTAssert" /tmp/swift-test.log | head -80
          exit $tcode

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cortexd -> target
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Build app + dmg
        run: native/scripts/bundle.sh "${{ inputs.tag || '0.3.0-dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Cortex-native
          path: native/build/Cortex.dmg

  # Separate so it can be re-run on its own (and the full error body is visible if GitHub refuses).
  publish:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cortex-native
          path: dl
      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set +e
          cp dl/Cortex.dmg "Cortex-native-$TAG.dmg"
          NOTES="Native (Swift) preview. Not notarized: if macOS says the app is damaged run  xattr -cr /Applications/Cortex.app  (or Open Anyway in System Settings → Privacy & Security). Quit any older Cortex first so there aren't two Islands."
          gh release create "$TAG" "Cortex-native-$TAG.dmg" --prerelease --target "$GITHUB_SHA" --title "Cortex native $TAG" --notes "$NOTES"
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== gh release create failed ($code); asking the API directly for the full error ==="
            gh api -i -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Cortex native $TAG" -F prerelease=true -f body="$NOTES" 2>&1 | head -40
            echo "=== existing tags / releases ==="
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=3" --jq '.[].tag_name' 2>&1 | head
            gh api "repos/$GITHUB_REPOSITORY/rulesets" 2>&1 | head -30
            exit $code
          fi
