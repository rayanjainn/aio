# Builds the native (Swift) AIO app on every push to a native/** branch and,
# when run manually with a tag, publishes it as a PRE-release (never "latest",
# so the current stable release and the auto-updater are untouched).
name: Native

on:
  push:
    branches: ["native/**"]
    paths: ["native/**", "cortexd/**", ".github/workflows/native.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to publish, e.g. v0.3.0-native.1 (leave empty to only build)"
        required: false
      existing_run_id:
        description: "Skip building: attach the installer of this earlier successful run to `tag` (re-publish)"
        required: false

permissions:
  contents: write

jobs:
  # Fast feedback: compiles only the Swift code (~1 min) so errors surface quickly.
  swift-check:
    if: ${{ inputs.existing_run_id == '' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift
        shell: bash
        run: |
          cd native
          set +e
          swift build -c debug -Xswiftc -warnings-as-errors > /tmp/swift-build.log 2>&1
          code=$?
          echo "=== swift build exit code: $code ==="
          grep -E "error:" -A5 /tmp/swift-build.log | head -150
          echo "=== warnings (unique) ==="
          grep -E "warning:" /tmp/swift-build.log | sed -E 's#/Users/runner/work/aio/aio/native/##' | sort -u | head -80
          if [ $code -ne 0 ]; then exit $code; fi
          swift test > /tmp/swift-test.log 2>&1
          tcode=$?
          echo "=== swift test exit code: $tcode ==="
          grep -E "error:|failed|Executed|XCTAssert" /tmp/swift-test.log | head -80
          exit $tcode

  build:
    if: ${{ inputs.existing_run_id == '' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cortexd -> target
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Build app + dmg
        run: native/scripts/bundle.sh "${{ inputs.tag || '0.3.0-dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AIO-native
          path: native/build/AIO.dmg

  # Separate so it can be re-run on its own (and the full error body is visible if GitHub refuses).
  publish:
    needs: build
    if: ${{ inputs.tag != '' && inputs.existing_run_id == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIO-native
          path: dl
      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          cp dl/AIO.dmg "AIO-native-$TAG.dmg"
          NOTES="Native (Swift) preview. Not notarized: if macOS says the app is damaged run  xattr -cr /Applications/AIO.app  (or Open Anyway in System Settings → Privacy & Security). Quit any older AIO or Cortex first so there aren't two Islands."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "AIO native $TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "AIO-native-$TAG.dmg" --repo "$GITHUB_REPOSITORY" --clobber

  # Re-publish: no build, just attach the installer of an earlier successful run.
  republish:
    if: ${{ inputs.existing_run_id != '' && inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the built installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.existing_run_id }}" -n AIO-native -D dl --repo "$GITHUB_REPOSITORY"
      - name: Create the release if needed, attach the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          cp dl/AIO.dmg "AIO-native-$TAG.dmg"
          NOTES="Native (Swift) preview. Not notarized: if macOS says the app is damaged run  xattr -cr /Applications/AIO.app  (or Open Anyway in System Settings → Privacy & Security). Quit any older AIO or Cortex first so there aren't two Islands."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "AIO native $TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "AIO-native-$TAG.dmg" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
