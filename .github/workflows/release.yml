# Publishes a stable AIO release (the one the website's Download button points to).
# Run it from the Actions tab (or the API) with a version such as v0.3.0.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cortexd -> target
      - name: Import Developer ID certificate (only when the secrets exist)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # MACOS_CERT_P12 may hold a Developer ID certificate (signed + notarized) or a self-signed one (stable grants).
          if [ -z "$CERT_P12" ]; then echo "No signing certificate configured: building ad-hoc."; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p cortex "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p cortex "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k cortex "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -n "$ID" ]; then
            echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          else
            # A self-signed certificate (native/scripts/make-signing-cert.sh): no notarization, but every release
            # has the same signature identity, so macOS keeps Accessibility / Screen Recording grants across updates.
            # Sign by SHA-1 fingerprint: a self-signed certificate is untrusted (CSSMERR_TP_NOT_TRUSTED), and codesign
            # only finds untrusted identities by hash, not by name.
            ID=$(security find-identity -p codesigning "$KC" | grep -m1 -oE '[0-9A-F]{40}')
            echo "SELF_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          fi
          echo "Signing identity: $ID"
      - name: Build universal app + dmg
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: native/scripts/bundle.sh "${{ inputs.version }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp native/build/AIO.dmg "native/build/AIO-${{ inputs.version }}.dmg"
          # Also attach a fixed-name copy, so releases/latest/download/AIO.dmg always downloads the newest build.
          gh release create "${{ inputs.version }}" "native/build/AIO-${{ inputs.version }}.dmg" "native/build/AIO.dmg" \
            --target "$GITHUB_SHA" --title "AIO ${{ inputs.version }}" --latest \
            --notes "AIO is the new name of Cortex: same app, same settings and permissions — updates rename it for you. Download the .dmg and drag AIO to Applications. AIO is not notarized by Apple (that needs a paid developer account), so the first time macOS says it “could not verify AIO is free of malware” or that it is “damaged”. It is safe to open: run  xattr -cr /Applications/AIO.app  once in Terminal, or open System Settings → Privacy & Security and click Open Anyway. macOS 14 or later; Liquid Glass needs macOS 26."
