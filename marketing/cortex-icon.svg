<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cortex app icon — Liquid Glass: graphite slab, frosted lens, open "C" ring
       (memory) with a recall node at its opening (the C of Cortex; the node is what you recall). -->
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a54"/>
      <stop offset="0.45" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </radialGradient>
    <linearGradient id="lensRim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#slab)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- light caustics behind the glass -->
    <circle cx="640" cy="690" r="210" fill="#ffffff" opacity="0.06" filter="url(#soft)"/>
    <circle cx="380" cy="330" r="160" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- frosted glass lens -->
  <circle cx="512" cy="512" r="268" fill="url(#lens)"/>
  <circle cx="512" cy="512" r="266" fill="none" stroke="url(#lensRim)" stroke-width="5"/>
  <path d="M300 420 A228 228 0 0 1 560 290" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>

  <!-- the mark: open ring + recall node -->
  <g transform="rotate(45 512 512)">
    <path d="M 512 342 A 170 170 0 1 0 682 512" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="66" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M 512 342 A 170 170 0 1 0 682 512" fill="none" stroke="url(#ring)" stroke-width="58" stroke-linecap="round"/>
  </g>
  <circle cx="694" cy="512" r="44" fill="#fff" opacity="0.6" filter="url(#soft)"/>
  <circle cx="694" cy="512" r="36" fill="#fff"/>
</svg>
